basePath: /
definitions:
  handler.CreateProcessRequest:
    properties:
      template_id:
        example: 1
        type: integer
      title:
        example: Найм Иванова
        type: string
    type: object
  handler.CreateTemplateRequest:
    properties:
      description:
        example: Стандартный процесс найма сотрудника
        type: string
      name:
        example: Процесс найма
        type: string
      tasks:
        items:
          $ref: '#/definitions/model.TaskTemplate'
        type: array
    type: object
  handler.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handler.LoginRequest:
    properties:
      password:
        example: password123
        type: string
      username:
        example: ivanov
        type: string
    type: object
  handler.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/model.User'
    type: object
  handler.RegisterRequest:
    properties:
      password:
        example: password123
        type: string
      role:
        example: worker
        type: string
      username:
        example: ivanov
        type: string
    type: object
  handler.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  handler.UpdateStatusRequest:
    properties:
      status:
        enum:
        - pending
        - in_progress
        - done
        example: done
        type: string
    type: object
  model.Attachment:
    properties:
      file_path:
        type: string
      file_size_kb:
        type: integer
      id:
        type: integer
      task_id:
        type: integer
      uploaded_at:
        type: string
    type: object
  model.Process:
    properties:
      finished_at:
        type: string
      id:
        type: integer
      started_at:
        type: string
      status:
        type: string
      tasks:
        items:
          $ref: '#/definitions/model.Task'
        type: array
      title:
        type: string
    type: object
  model.Task:
    properties:
      attachments:
        items:
          $ref: '#/definitions/model.Attachment'
        type: array
      comment:
        type: string
      depends_on:
        items:
          type: integer
        type: array
      finished_at:
        type: string
      for_role:
        type: string
      id:
        type: integer
      is_file_required:
        type: boolean
      plan_hours:
        type: integer
      process_id:
        type: integer
      started_at:
        type: string
      status:
        type: string
      title:
        type: string
      users:
        items:
          $ref: '#/definitions/model.User'
        type: array
    type: object
  model.TaskTemplate:
    properties:
      depends_on:
        items:
          type: integer
        type: array
      for_role:
        type: string
      id:
        type: integer
      is_file_required:
        type: boolean
      plan_hours:
        type: integer
      template_id:
        type: integer
      title:
        type: string
    type: object
  model.Template:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      tasks:
        items:
          $ref: '#/definitions/model.TaskTemplate'
        type: array
    type: object
  model.User:
    properties:
      created_at:
        type: string
      id:
        type: integer
      role:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API для управления рабочими процессами
  title: Менеджер рабочих процессов API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Вход в систему, возвращает JWT-токен
      parameters:
      - description: Учетные данные
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Авторизация пользователя
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Создание нового пользователя
      parameters:
      - description: Данные для регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Регистрация пользователя
      tags:
      - Auth
  /processes:
    post:
      consumes:
      - application/json
      description: Создает экземпляр процесса на основе шаблона
      parameters:
      - description: Данные процесса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateProcessRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Process'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создание процесса из шаблона
      tags:
      - Processes
  /processes/{id}:
    get:
      description: Возвращает процесс со всеми задачами и зависимостями
      parameters:
      - description: ID процесса
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Process'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение процесса по ID
      tags:
      - Processes
  /tasks/{id}/status:
    patch:
      consumes:
      - application/json
      description: Изменяет статус задачи (pending/in_progress/done)
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
        type: integer
      - description: Новый статус
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновление статуса задачи
      tags:
      - Tasks
  /templates:
    get:
      description: Возвращает все шаблоны процессов
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Template'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение списка шаблонов
      tags:
      - Templates
    post:
      consumes:
      - application/json
      description: Создание нового шаблона процесса с задачами
      parameters:
      - description: Данные шаблона
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateTemplateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Template'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создание шаблона
      tags:
      - Templates
  /templates/{id}:
    get:
      description: Возвращает шаблон с задачами
      parameters:
      - description: ID шаблона
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Template'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение шаблона по ID
      tags:
      - Templates
securityDefinitions:
  BearerAuth:
    description: 'Введите токен в формате: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
